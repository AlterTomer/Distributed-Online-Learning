# Mackey-Glass, COMBINED drift (M12): beta and bias drift at
# once -- the law itself and a sensor offset.
#
# Coupling 'independent': the secondary draws its OWN jumps, per run seed. Needs a stochastic
# schedule: a linear ramp has one path however it is seeded, and the
# environment refuses that pairing rather than duplicate correlated.
#
# Each channel keeps the span M11 used for it, so the individual damages
# M6 and M11 measured are the terms the additivity test needs: beta 0.02
# (the chaotic window) and the sensor channels 0.1 (one noise sd, D108).
dataset: mackey_glass
series:
  channel: beta
  span: 0.02
  secondary_channel: bias
  secondary_span: 0.1
  coupling: independent
drift:
  schedule: recurring
  jump_degrees: 15.0
  jump_every: 25
  jump_seed: 0
