# The non-adapting baseline the *comparative* break is measured against.
#
# Identical to diffusion_sgd_atc -- same optimizer, same learning rate, same
# mixing -- up to `freeze_after`, and then it stops: no gradient step, no
# combine, no bandwidth. So "when does the learner stop beating this?" isolates
# *continued* adaptation from initial learning, and needs no threshold anyone
# had to choose.
#
# It must run inside the same experiment as the learners it is compared with,
# not as a separate run: they then share one environment and one theta_0, so
# the comparison is paired by construction rather than by seed (design note D4).
#
# freeze_after 300 at the default T=1500 gives it a fifth of the run to learn.
# Long enough to be a fair model of the initial distribution, early enough that
# most of the run is spent measuring whether standing still was a mistake.
# These must stay identical to configs/learner/diffusion_sgd_atc.yaml. They were
# not, at first -- written from memory as lr 0.05 against ATC's tuned 0.01, which
# made the baseline a *different* algorithm with five times the step size and
# quietly falsified the claim above. It happened to err safely (a larger warmup
# step froze it at a better point, so it was a stronger baseline and adapting
# still beat it sevenfold), but "safe by luck" is not the property wanted here.
name: frozen_atc
optimizer: sgd_momentum
lr: 0.01
momentum: 0.9
mix_optimizer_state: momentum
adapt_scope: local
freeze_after: 300
