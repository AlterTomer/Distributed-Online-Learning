# The diffusion EKF, mean-only sharing: eq. cov_local, the DEPLOYABLE variant.
#
#   adapt    (P^psi_v)^-1 = P_v^-1 + Delta_v          local data only
#   combine  m_v <- sum_u a_vu psi_u                  O(p) per link
#            P_v <- P^psi_v                           the covariance stays home
#
# An agent accepts its neighbours' ESTIMATES but keeps its own CONFIDENCE. This
# is the standard diffusion choice and what the communication claim ultimately
# rests on: 23 kB per link per step against 68 MB for the full variant.
#
# Its gap to `diffusion_ekf_full` is the price of not shipping covariances, and
# that gap is the reason the expensive variant is measured at all.
#
# NOT exact on a complete graph. With a local adapt step each agent updates on
# its own data and the combine averages covariances, which is not the same as
# summing information -- see `diffusion_ekf_onehop` for the variant that is.
name: diffusion_ekf

adapt_scope: local          # M_v = {v}; the name pins this and the builder checks it
covariance_sharing: local   # P_v <- P^psi_v

# The gamma family throughout. Multiplicative forgetting was rejected for the
# centralised filter in design note D76 -- with a softmax Fisher that decays to
# zero, lambda has no sustainable level -- and diffusing the belief does not
# repair that argument. The builder refuses lambda_forget != 1.
transition: scalar
gamma: 1.0
forgetting: process_noise
process_noise_q: 1.0e-5
lambda_forget: 1.0

# sigma_0^2: a TRUST REGION, not merely a prior. Carried at X13's selected value
# rather than re-tuned, which is the X14 discipline -- a setting chosen for the
# centralised filter and never adjusted, so that any shortfall is attributable
# to diffusion rather than confounded with tuning. Each agent sees 1/N of the
# information at the same forgetting rate, so if the belief settles too diffuse
# this is the first knob to revisit.
prior_scale: 0.01
