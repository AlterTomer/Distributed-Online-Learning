# One-hop adapt with mean-only sharing: the DEPLOYABLE form of the fix.
#
#   adapt    (P^psi_v)^-1 = P_v^-1 + sum_{u in N_v u {v}} Delta_u
#   combine  m_v <- sum_u a_vu psi_u ;  P_v <- P^psi_v
#
# X19 measured the two axes and found the combine axis empty: sharing covariances
# bought +0.0002 to +0.0007 for 2909x the bandwidth. The deficit is in the ADAPT
# step, where a local measurement set gives each agent one agent's information
# while the centralised filter sums all N -- and no combine rule can reach that,
# covariance intersection included, because averaging information is not summing
# it (design note D79).
#
# So this is the variant that matters: it fixes the axis that is broken and pays
# nothing on the axis that is not.
#
# BANDWIDTH (corrected in D92, D94). The note prices a one-hop exchange as the
# information pair (B_u, H_u^T s_u): p*nq + p = 119,228 scalars per link at
# p=2908, q=10, n=4. The raw batch it is derived from is n(d+1) = 788, and a
# receiver holding theta_u^- can rebuild B_u and H_u^T s_u exactly -- 32x cheaper
# in that message, and cheaper whenever p > (d+1)/q ~ 20. The update is
# deferred, so a step takes TWO messages: theta_u^- + the batch before it, psi_u
# after it. 6,604 per link per direction, above momentum ATC's 5,816. The
# simulation exchanges the pair; the ledger prices the batch.
#
# LINEARISATION POINT. Each neighbour's block is linearised at the SENDER's
# theta_u^-, so blocks from different points are summed into one update (D93).
# diffusion_ekf_onehop_mean_receiver linearises at the receiver's own point
# instead, which also drops theta_u^- from the first message (3,696).
#
# The other costs are COMPUTE -- measured at 2.04x a local adapt (D93), with the
# neighbours' Jacobians 13% of the step -- and PRIVACY: raw samples leave the node.
name: diffusion_ekf_onehop_mean

adapt_scope: one_hop        # M_v = N^c_v union {v}
covariance_sharing: local   # P_v <- P^psi_v

transition: scalar
gamma: 1.0
forgetting: process_noise
process_noise_q: 1.0e-5
lambda_forget: 1.0
prior_scale: 0.01
