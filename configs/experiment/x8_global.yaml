# X8's paired twin: the same run with every agent drifting together.
#
# The comparison X8 exists to make is per-node scope against global scope, so
# the control differs in `drift_scope` and in nothing else -- same topology,
# same seeds, same horizon, same cadence, same learners.
#
# X2 used to serve this role and no longer can: it is on ring while X8 moved to
# Erdos-Renyi, so the difference would be scope *and* topology together, with
# no way to attribute a result to either (design note D52).
include:
  env: mnist_per_node_linear
  graph: erdos_renyi
  model: mlp_small

learners:
  [centralized_sgd, diffusion_sgd_atc, diffusion_sgd_atc_plain, local_only, frozen_atc]

run:
  name: x8_global
  horizon: 1500

env:
  drift_scope: global
  drift:
    # 33.75, not 45, and this was a bug found by reading the results.
    #
    # Under per_node the multipliers run over [0.5, 1.0] and average 0.75, so
    # the agents end at 22.5 to 45 degrees with a *mean* of 33.75. A global twin
    # at 45 therefore drifts 33% further on average, and X8 compared
    # heterogeneity and drift amount at once.
    #
    # The tell was frozen_atc: it stopped adapting, so its error tracks pure
    # displacement, and it came out 0.10 *better* under per_node -- which no
    # story about heterogeneity explains and "less drift" explains exactly.
    #
    # Matching the mean leaves the spread as the only difference, which is what
    # X8 is asking about. Matching the maximum instead would keep the confound.
    total_degrees: 33.75

eval:
  evalsets: [prequential, current]
