# Which diffusion ordering, and how much does it matter?
# Reports parameter disagreement alongside error rate.
include:
  env: mnist_stationary
  graph: ring
  model: mlp_small

# atc_plain is here for the same reason as in X1: it is the payload-matched
# variant (p per link, against 2p for the momentum-mixed ones), so the
# ordering comparison is not confounded with a payload difference.
learners: [diffusion_sgd_atc, diffusion_sgd_cta, diffusion_sgd_atc_plain, centralized_sgd]

run:
  name: x1b_atc_vs_cta
  horizon: 1500
