# Rotating baseline: does the gap widen, does local-only collapse? (Q3)
# alpha = 45 / 1500 = 0.03 deg/step, derived by the loader.
include:
  env: mnist_rotating_linear
  graph: ring
  model: mlp_small

# atc_plain is here for the same reason as in X1: F2 plots error against
# bandwidth, and the payload-matched variant is the series that axis exists
# for. Without it the rotating panel of F2 cannot show whether the crossing
# seen under stationary data survives drift -- which is the question phase 5
# needs answered, since Diff-EKF's claim is stated at p per link.
learners: [centralized_sgd, diffusion_sgd_atc, diffusion_sgd_atc_plain, local_only]

run:
  name: x2_rotating
  horizon: 1500
