# Adaptation transient around an abrupt shift: the cleanest tracking test (Q3).
include:
  env: mnist_rotating_piecewise
  graph: ring
  model: mlp_small

# atc_plain included so F7's transient covers the payload-matched variant
# too: recovery speed at p per link is what phase 5 has to beat.
learners: [centralized_sgd, diffusion_sgd_atc, diffusion_sgd_atc_plain, local_only]

run:
  name: x5_abrupt_shift
  horizon: 1500
