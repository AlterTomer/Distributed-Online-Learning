# Mackey-Glass, combined drift: beta + bias, independent (M12).
# Damage is paired against m6_stationary_a, which shares the learners,
# seeds, horizon, R scale and graph and differs in the drift alone.
include:
  env: mg_comb_beta_bias_independent
  graph: erdos_renyi
  model: mg_transformer

learners: [centralized_sgd, diffusion_sgd_atc, diffusion_sgd_atc_plain, local_only]

run:
  name: m_comb_beta_bias_independent
  horizon: 1500
  dtype: float64

eval:
  evalsets: [prequential, current, canonical]
  batch_size: 64
