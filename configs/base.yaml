# Defaults every config inherits. An experiment config overrides what it needs
# and selects one entry from each of env/, graph/, model/ plus a list of
# learners; see configs/experiment/ for examples.
#
# Values here are the phase-1 defaults agreed in WORKPLAN.md section 10.

run:
  name: unnamed
  seeds: [0, 1, 2, 3, 4]
  horizon: 1500          # T; see the shard budget in WORKPLAN.md section 4.2
  eval_every: 25         # K
  dtype: float32         # float64 for the exactness check
  device: cpu
  out_dir: results

graph:
  topology: ring
  n_nodes: 10            # N
  weights: metropolis
  params: {}

env:
  samples_per_node_per_step: 4   # n; raised from 2 -- see WORKPLAN.md 3.7.
                                 # N*n*T = 10*4*1500 = 60000, exactly the shard budget.
                                 # Larger n lowers every method's error but collapses
                                 # the cooperation gap, so n is an axis (X4), not a
                                 # value to optimise.
  label_availability: 1.0        # pi_lab
  partition:
    kind: iid
    beta: 1.0                    # Dirichlet concentration; used when kind == dirichlet
  drift:
    schedule: stationary
    total_degrees: 45.0          # the cap of WORKPLAN.md section 4.3; alpha is DERIVED
    change_points: []
    jump_degrees: 15.0
    amplitude_degrees: 30.0
    period: 500
    per_node_spread: 0.5        # only under drift_scope: per_node
  drift_scope: global
  allow_epochs: false

model:
  name: mlp_small
  input_size: 14         # 14x14 downsampled input; see WORKPLAN.md section 4.6
  hidden: [14]
  output_dim: 10
  activation: gelu       # smooth; ReLU breaks the phase-5 remainder bound

reference:
  epochs: 100          # raised from 20: at 20, 9 of 16 levels stopped at the budget
  batch_size: 128
  lr: 0.003
  init_strategy: shared_seed   # shared_seed | independent_seeds | warm_start
  selection: validation        # validation | fixed_budget
  validation_size: 5000        # held out from train; 0 under fixed_budget
  rotation_min_degrees: -30.0  # the union of every schedule's range
  rotation_max_degrees: 45.0
  rotation_step_degrees: 5.0
  seed: 0

learners:
  - name: diffusion_sgd_atc

eval:
  evalsets: [prequential, current, canonical]
  backward_separation_degrees: 15.0   # anchored by rotation, not by a step count
  batch_size: 1000
